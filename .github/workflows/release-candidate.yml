name: Windows Release Candidate

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-candidate:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Build and verify release candidate
        shell: pwsh
        run: >-
          .\scripts\build-release-candidate.ps1
          -ArtifactDirectory artifacts\release-candidate

      - name: Upload release candidate evidence
        if: always() && github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: machine-studio-release-candidate-${{ github.sha }}
          path: artifacts/release-candidate
          if-no-files-found: error
          retention-days: 3
